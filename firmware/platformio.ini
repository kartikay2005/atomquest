; Duet firmware. The ESP32-C3 build uses the same src/core as the simulator.
; Laptop builds (SIL library + unit tests) use CMake: see firmware/CMakeLists.txt.

[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 160000000L
build_flags =
    -Iinclude
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; -DDUET_WIFI_SSID=\"your-ssid\" -DDUET_WIFI_PASS=\"your-pass\"
    ; -DDUET_MQTT_HOST=\"192.168.1.10\" -DDUET_AC_PROTOCOL=VOLTAS -DDUET_NATIVE_FAN=0
build_src_filter = +<core/> +<esp32/>
lib_deps =
    crankyoldgit/IRremoteESP8266@^2.9.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
